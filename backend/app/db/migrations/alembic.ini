# Alembic configuration for the application database.
#
# The DSN is deliberately absent: it is read from Settings in env.py, so the
# password lives in exactly one place and never in a file that gets committed.
# Migrations run as the schema owner, not as the restricted runtime role.

[alembic]
script_location = backend/app/db/migrations
prepend_sys_path = .
# Timestamped, so the order of files on disk matches the order of history and
# two branches created on the same day do not collide.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
