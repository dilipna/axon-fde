# AxonFDE local environment.
#
# Profiles exist because this machine has 15.7 GB of RAM and SQL Server alone
# wants 2 GB. Never start more than the phase you are working on needs.
#
#   core   -> postgres + mssql + minio          (Phase 1)
#   stream -> redpanda + console                (Phase 2)
#   all    -> everything, for `down` / `down -v`
#
# Observability note: Langfuse self-hosting (v3+) requires ClickHouse + Redis +
# its own MinIO, which costs ~4 GB of RAM. We default to Langfuse Cloud's free
# tier instead (set LANGFUSE_* in .env). A self-hosted profile is deferred to
# Phase 5, where it is written up in docs/adr/.

name: axonfde

services:
  # ---------------------------------------------------------------------------
  # Application database: incidents, evidence, audit chain, vectors, checkpoints
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["core", "all"]
    environment:
      POSTGRES_USER: axon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axon_local_dev}
      POSTGRES_DB: axon
      # Deterministic collation: ordering differences between host and CI have
      # bitten enough projects that this is worth pinning explicitly.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axon -d axon"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------
  # "Legacy" enterprise system. Deliberately a different engine from the app DB:
  # the integration story is only credible across a real dialect boundary.
  # We never migrate this schema - we seed it and read approved vw_ai_* views.
  # ---------------------------------------------------------------------------
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["core", "all"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Axon_Local_Dev_1}
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    mem_limit: 2560m
    healthcheck:
      # The 2022 image ships sqlcmd under /opt/mssql-tools18 and requires -C
      # (trust self-signed cert). Getting this wrong makes the container look
      # permanently unhealthy while actually being fine.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  # ---------------------------------------------------------------------------
  # Object store for artifacts: images, PDFs, model artifacts, scenario outputs.
  # Same S3 API locally and in AWS, so provenance code is environment-agnostic.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    profiles: ["core", "all"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-axonadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-axon_local_dev}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Phase 2 only. Defined now so the topology is visible, started later.
  # Single node, memory-capped: Kafka semantics without the JVM footprint.
  # Justified by replay-from-offset + consumer groups + idempotent consumption;
  # if we are not using all three by the end of Phase 2, it gets cut (see ADR).
  # ---------------------------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:latest
    profiles: ["stream", "all"]
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "${REDPANDA_PORT:-9092}:9092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  redpanda-console:
    image: redpandadata/console:latest
    profiles: ["stream", "all"]
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8080}:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    mem_limit: 256m

volumes:
  postgres_data:
  mssql_data:
  minio_data:
  redpanda_data:
