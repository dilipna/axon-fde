[project]
name = "axonfde"
version = "0.1.0"
description = "Multimodal AI decision intelligence and incident response for cold-chain logistics"
requires-python = ">=3.12,<3.13"
readme = "README.md"

dependencies = [
    # --- API ---
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "pyjwt[crypto]>=2.10",

    # --- Application database (PostgreSQL + pgvector) ---
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",

    # --- Legacy database (SQL Server, sync driver run in a threadpool) ---
    "pyodbc>=5.2",

    # --- SQL safety ---
    "sqlglot>=30.18,<31",

    # --- Agent orchestration ---
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",

    # --- LLM provider ---
    "anthropic>=1.7,<2",

    # --- Retrieval (local ONNX embeddings; deliberately avoids a torch dependency) ---
    "fastembed>=0.8,<0.9",

    # --- Object store ---
    "boto3>=1.35",

    # --- Scheduling (outcome verification) ---
    "apscheduler>=3.11",

    # --- Observability ---
    "structlog>=24.4",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "langfuse>=4.15,<5",

    # --- Data / ML ---
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",

    # --- Utilities ---
    "httpx>=0.28",
    "typer>=0.15",
    "pyyaml>=6.0",
    "orjson>=3.10",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "testcontainers[postgres,mssql]>=4.8",
    "respx>=0.22",
    "faker>=33.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "poethepoet>=0.31",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "simulator", "benchmarks"]

# ---------------------------------------------------------------------------
# Task runner (cross-platform; replaces Make, which is not installed on Windows)
# ---------------------------------------------------------------------------
[tool.poe.tasks]
up = { cmd = "docker compose --profile core up -d", help = "Start core services (postgres, mssql, minio)" }
up-obs = { cmd = "docker compose --profile obs up -d", help = "Start the observability stack (langfuse)" }
down = { cmd = "docker compose --profile all down", help = "Stop all services" }
nuke = { cmd = "docker compose --profile all down -v", help = "Stop services AND delete volumes" }
logs = { cmd = "docker compose logs -f", help = "Tail service logs" }

fmt = { cmd = "ruff format .", help = "Format code" }
lint = { shell = "ruff check . && ruff format --check .", help = "Lint and format check" }
typecheck = { cmd = "mypy backend/app simulator benchmarks", help = "Static type check (strict)" }
arch = { cmd = "lint-imports", help = "Verify module boundary contracts" }

test = { cmd = "pytest -m 'not live'", help = "All tests except live-LLM tests" }
test-unit = { cmd = "pytest tests/unit", help = "Unit tests only (fast, no containers)" }
test-int = { cmd = "pytest tests/integration", help = "Integration tests (requires Docker)" }
test-sec = { cmd = "pytest tests/security", help = "Security tests (SQL guard, policy bypass)" }
test-live = { cmd = "pytest -m live", help = "Tests that call the real LLM API (costs money)" }
cov = { cmd = "pytest -m 'not live' --cov=backend/app --cov-report=term-missing --cov-report=html" }

check = { sequence = ["lint", "typecheck", "arch", "test"], help = "Everything CI runs" }

api = { cmd = "uvicorn backend.app.main:app --reload --port 8000", help = "Run the API locally" }
migrate = { cmd = "alembic -c backend/app/db/migrations/alembic.ini upgrade head" }
seed = { cmd = "python -m scripts.seed", help = "Seed legacy SQL Server and app Postgres" }

demo = { cmd = "python -m scripts.demo", help = "Run the end-to-end incident demo" }
forge = { cmd = "python -m simulator.incidentforge.cli", help = "IncidentForge scenario CLI" }
bench = { cmd = "python -m benchmarks.axonbench.runner", help = "Run AxonBench" }
bench-report = { cmd = "python -m benchmarks.axonbench.report", help = "Generate the benchmark report" }

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/app/db/migrations/versions", "apps/web"]

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "DTZ",
    "T20",
    "SIM",
    "PTH",
    "RUF",
    "S",
]
ignore = [
    "S101",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"scripts/**" = ["T20"]
"benchmarks/**" = ["T20"]
"simulator/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "simulator", "benchmarks"]

# ---------------------------------------------------------------------------
# Typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["backend/app/db/migrations/versions/", "apps/web/"]

[[tool.mypy.overrides]]
module = [
    "pyodbc.*",
    "lightgbm.*",
    "fastembed.*",
    "langfuse.*",
    "apscheduler.*",
    "testcontainers.*",
    "pyarrow.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast, no external dependencies",
    "integration: requires Docker containers",
    "agent: exercises the LangGraph workflow via LLM cassettes",
    "security: adversarial / policy-bypass tests",
    "live: calls the real LLM API and costs money",
    "slow: takes more than ~5 seconds",
]

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/migrations/*", "*/__init__.py"]

# ---------------------------------------------------------------------------
# Module boundary contracts (modularity that is enforced, not aspirational)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["backend", "simulator", "benchmarks"]
# Required because several contracts forbid third-party packages (pyodbc,
# httpx, anthropic) rather than only first-party modules.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain layer depends on no other internal layer"
type = "forbidden"
source_modules = ["backend.app.domain"]
forbidden_modules = [
    "backend.app.api",
    "backend.app.db",
    "backend.app.agents",
    "backend.app.tools",
]

[[tool.importlinter.contracts]]
name = "Only the legacy repository may import pyodbc"
type = "forbidden"
source_modules = [
    "backend.app.api",
    "backend.app.agents",
    "backend.app.tools",
    "backend.app.evidence",
    "backend.app.decision",
    "backend.app.policies",
]
forbidden_modules = ["pyodbc"]

[[tool.importlinter.contracts]]
# The two databases are different engines with different concurrency models:
# asyncpg on the event loop, pyodbc in a worker thread. Letting either side
# import the other is how a blocking ODBC call ends up on the event loop, and
# how the read-only guarantee on the legacy system gets quietly routed around.
name = "The application database never reaches for the legacy driver"
type = "forbidden"
source_modules = ["backend.app.db.app"]
forbidden_modules = ["pyodbc", "backend.app.db.legacy"]

[[tool.importlinter.contracts]]
name = "The legacy path stays synchronous and self-contained"
type = "forbidden"
source_modules = ["backend.app.db.legacy"]
forbidden_modules = ["asyncpg", "backend.app.db.app"]

[[tool.importlinter.contracts]]
name = "The policy engine is pure: no I/O"
type = "forbidden"
source_modules = ["backend.app.policies"]
forbidden_modules = ["backend.app.db", "httpx", "anthropic", "boto3"]

[[tool.importlinter.contracts]]
name = "The decision engine is pure: no I/O and no LLM"
type = "forbidden"
source_modules = ["backend.app.decision"]
forbidden_modules = ["backend.app.db", "httpx", "anthropic", "backend.app.llm"]

[[tool.importlinter.contracts]]
name = "The simulator does not depend on the application"
type = "forbidden"
source_modules = ["simulator"]
forbidden_modules = ["backend.app.api", "backend.app.agents", "backend.app.llm"]
