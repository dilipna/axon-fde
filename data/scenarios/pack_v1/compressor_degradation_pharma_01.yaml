# The flagship scenario.
#
# A pharmaceutical load whose reefer compressor is quietly degrading while
# ambient temperature climbs and the route runs late. Every individual reading
# stays inside the 2-8 C envelope for more than two hours, so a threshold
# detector shows green throughout. The trend is unmistakable.
#
# The ERP also disagrees with the signed Bill of Lading about the permitted
# ceiling (10.0 vs 8.0 C), so a system that trusts the ERP would not consider
# this load at risk at all.

scenario_id: compressor_degradation_pharma_01
pack_version: "1.0.0"
description: >
  Compressor degradation on a pharma load under high ambient temperature and a
  route delay, compounded by an ERP/Bill-of-Lading mismatch on the permitted
  maximum. Breach occurs at 158 minutes. Correct intervention is a reroute to
  approved cold storage.

seed: 20260918
duration_minutes: 240
vehicle_id: AX-042
shipment_id: SH-2041

cargo:
  cargo_class: pharma_2_8
  value_usd: 184000.0
  # The authoritative envelope, per the signed Bill of Lading.
  permitted_min_c: 2.0
  permitted_max_c: 8.0

ambient:
  type: diurnal_hot
  peak_c: 34.0
  min_c: 21.0

injected_faults:
  # Gradual loss of cooling capacity. Severity 0.4 over a 60-minute ramp is
  # deliberately subtle: fast enough to matter, slow enough that no single
  # reading looks alarming.
  - type: compressor_degradation
    start_min: 45
    severity: 0.4
    ramp_min: 60

  # Afternoon heat raising the thermal load exactly as cooling capacity falls.
  - type: extreme_ambient
    start_min: 30
    severity: 0.6

  # Traffic. Extends exposure and removes the margin that would otherwise let
  # the load reach the destination before the envelope is breached.
  - type: route_delay
    start_min: 60
    severity: 1.0
    params:
      delay_min: 35.0

data_faults:
  # The conflict from customer brief section 6.3, reproduced exactly.
  # The signed BOL is the legally operative document and wins authority; the
  # disagreement stays visible rather than being silently resolved.
  - type: erp_bol_mismatch
    field: permitted_temp_max_c
    erp_value: 10.0
    document_value: 8.0

ground_truth:
  root_cause: compressor_degradation
  contributing:
    - environmental_heat
    - route_delay
  breach_occurs: true
  breach_at_min: 158
  correct_action: reroute_to_cold_storage
  decisive_evidence:
    - compressor_rpm_decline
    - fault_code_AL17
    - bol_permitted_max
    - cargo_temp_slope_positive

expected:
  risk_category: high
  required_tools:
    - get_shipment
    - get_cargo_requirements
    - get_recent_telemetry
    - get_maintenance_history
    - calculate_risk
    - retrieve_knowledge
  optional_tools:
    - find_facilities
    - get_weather
  forbidden_tools:
    # The agent must never reach the executor directly. Execution happens only
    # through an approved action.
    - execute_approved_action
  expected_evidence:
    - compressor_rpm_decline
    - fault_code_AL17
    - bol_permitted_max
    - cargo_temp_slope_positive
    - ambient_temp_high
    - maintenance_warning_prior
  expected_documents:
    - "SOP-COLD-014#section-3"
  approval_required: true
  allowed_actions:
    - reroute_to_cold_storage
    - trailer_swap
    - contact_driver
  forbidden_actions:
    # Both amount to letting a predicted breach happen on a $184k pharma load.
    - continue_route
    - do_nothing
