name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never calls a paid API. Agent tests replay recorded cassettes, which is
  # what makes them deterministic as well as free.
  AXON_LLM_MODE: cassette
  AXON_ENV: ci
  # A test that skips is a test that did not run. Locally a missing database
  # or an ungenerated scenario recording skips, which keeps `poe test` useful
  # on a fresh clone. Here it fails: a job that starts no database, skips
  # every test that needed one and reports success is a green tick that means
  # nothing. See tests/conftest.py.
  AXON_REQUIRE_INTEGRATION: "1"

jobs:
  quality:
    name: Lint, types, architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint and format check
        run: uv run poe lint

      - name: Type check (mypy --strict)
        run: uv run poe typecheck

      - name: Module boundary contracts
        run: uv run poe arch

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      # `data/generated/` is gitignored, so the recordings have to be rebuilt.
      # They are deterministic from a seed, which is what makes that safe: the
      # scenario CI measures is byte-identical to the one on a laptop.
      - name: Generate scenario recordings
        run: uv run poe forge run-all

      - name: Verify scenario determinism
        run: uv run poe forge verify

      - name: Run unit tests
        run: uv run pytest tests/unit -v --cov=backend/app --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml
          if-no-files-found: ignore

  security:
    name: Security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres, because invariant I5 is a claim about what ends up *persisted*
    # after an attack: the execution gate tests end by asking the database how
    # many side effects an attacker managed to cause, and the only acceptable
    # answer is zero. A test that asserted only "an exception was raised" would
    # be checking the plumbing rather than the outcome.
    #
    # No SQL Server here. The SQL guard tests parse statements rather than run
    # them, so the legacy engine buys this job nothing but five minutes.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axon
          POSTGRES_PASSWORD: axon_local_dev
          POSTGRES_DB: axon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axon -d axon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret is just as leaked if it was committed
          # and later removed, and the default shallow clone would only
          # ever scan the newest commit.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      # These are hard gates, not advisory. A single prohibited SQL operation
      # reaching the driver, or a single policy bypass, fails the build.
      # Builds the schema, the append-only trigger and the restricted
      # `axon_app` runtime role. Without it the execution-gate fixtures have
      # nothing to connect as, and AXON_REQUIRE_INTEGRATION turns that into a
      # failure rather than a skip - which is exactly how the missing service
      # was found, rather than by noticing a quietly shrinking test count.
      - name: Migrate the application database
        run: uv run poe migrate

      - name: SQL guard, policy bypass and execution gate tests
        run: uv run pytest tests/security -v

      # Run directly rather than through gitleaks-action, which executes the
      # scanner inside a container and resolves GITLEAKS_CONFIG against a path
      # that is not the one the workspace is mounted at - so our allowlist was
      # silently ignored and the step failed on the local development
      # credentials it was supposed to permit. Invoking the binary means the
      # command here is exactly the command a developer can run locally:
      #
      #   gitleaks detect --source . --config .gitleaks.toml
      #
      # The version is pinned so the rule set cannot change under us and turn
      # a green build red without a commit.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks --version
          /tmp/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose
  integration:
    name: Integration tests (real Postgres + SQL Server)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Real engines, because the claims these tests make are about real
    # engines: append-only enforcement is a PostgreSQL grant and trigger, and
    # the legacy permission boundary is a SQL Server one. A stand-in would
    # test neither.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axon
          POSTGRES_PASSWORD: axon_local_dev
          POSTGRES_DB: axon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axon -d axon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Axon_Local_Dev_1
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Axon_Local_Dev_1 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 45s

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The Ubuntu release is read from the runner rather than hard-coded.
      # `ubuntu-latest` moved from 22.04 to 24.04, and Microsoft publishes a
      # separate package list per release, so a pinned 22.04 list made this
      # step fail on every run - which is what kept the integration job red.
      - name: Install the Microsoft ODBC driver
        run: |
          set -euo pipefail
          . /etc/os-release
          echo "Runner: $NAME $VERSION_ID"
          curl -fsSL -o /tmp/ms-prod.deb \
            "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb"
          sudo dpkg -i /tmp/ms-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          # Printed so that a future driver-name change shows up in the
          # log rather than as an opaque "data source not found".
          odbcinst -q -d
      - name: Install dependencies
        run: uv sync --frozen

      # Creates the schema, the append-only trigger and the restricted
      # `axon_app` runtime role. Without this the integration fixtures have
      # nothing to connect as.
      - name: Migrate the application database
        run: uv run poe migrate

      # Creates the ERP schema, the six vw_ai_* views and the read-only login,
      # then verifies least privilege actually holds.
      - name: Seed the legacy database
        run: uv run poe seed

      - name: Generate scenario recordings
        run: uv run poe forge run-all

      # `tests/e2e` runs here rather than in a job of its own: the demo needs
      # both engines *and* the generated recordings, which is exactly what
      # this job already has. A separate job would duplicate the whole setup
      # to run nine assertions.
      - name: Run integration and end-to-end tests
        run: uv run pytest tests/integration tests/e2e -v

  agent:
    name: Agent workflow (cassette replay)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      # The guard stays. pytest exits 5 when it collects nothing, which is
      # indistinguishable from a real failure at the job level, and the suite
      # was empty until B9 landed. Keeping it means deleting the last test
      # here reports honestly instead of going red for the wrong reason.
      #
      # No database and no API key: the graph tests run the workflow with
      # scripted model nodes, and the deterministic guards they protect do not
      # touch either.
      - name: Replay agent workflows
        run: |
          set -euo pipefail
          if find tests/agent -name 'test_*.py' | grep -q .; then
            uv run pytest tests/agent -v
          else
            echo "No agent tests found - the suite is expected to be populated."
          fi

  benchmark-gate:
    name: AxonBench regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [agent]

    # Live as of B10a, for the `rules_only` arm. The `rules_llm` arm joins it
    # once cassettes are recorded (B10b) - deliberately not before, because an
    # arm that needed an API key would either not run here or would spend money
    # on every push, and an arm that runs nowhere quietly stops being measured.
    #
    # The gate is **absolute on safety metrics** and reports quality metrics
    # without gating them. `poe bench` exits non-zero only when a safety metric
    # comes out non-zero; blending the two would let a disappointing lead-time
    # number be "fixed" by relaxing the threshold that guards approval bypass.
    #
    # No database and no API key: the graders exercise the policy engine and
    # the SQL guard's AST allowlist, both of which are pure.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      # Non-zero exit here means a safety claim was refuted: an unauthorised
      # action, an approval bypass, or a prohibited statement reaching the
      # driver. None of those is a tolerance.
      # No `--` before the flag. poethepoet forwards it literally to argparse,
      # which then rejects it - and the `--` was inherited from the disabled
      # placeholder step this job replaced, so it had never actually run. The
      # local command is exactly this one.
      - name: Run AxonBench (rules_only arm)
        run: uv run poe bench --arm rules_only

      # Regenerated rather than trusted. If the committed report disagrees
      # with what the run just produced, the diff is the finding.
      - name: Regenerate the report and show any drift
        run: |
          set -euo pipefail
          uv run poe bench-report
          git --no-pager diff --stat -- docs/evaluation/results.md
