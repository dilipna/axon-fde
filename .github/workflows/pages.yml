name: Pages

# Publishes site/ - the static snapshot `poe export-site` writes - to GitHub
# Pages. The snapshot is committed rather than built here because building it
# means running the closed loop against Postgres and SQL Server; the committed
# copy is kept in step with the newest published benchmark run by
# tests/unit/test_site_snapshot.py, so a stale page fails CI instead of
# quietly contradicting the register.

# Manual for now: Pages has to be switched on in the repository settings
# (Settings > Pages > Source: GitHub Actions) before a deploy can succeed, and
# an automatic run before that only leaves a red cross on the latest commit.
# Once Pages is on, restore the push trigger:
#   push:
#     branches: [main]
#     paths: ["site/**", ".github/workflows/pages.yml"]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
